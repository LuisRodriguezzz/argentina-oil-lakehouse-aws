[project]
name = "argentina-oil-lakehouse-aws"
version = "0.1.0"
description = "Lakehouse serverless en AWS sobre datos publicos del upstream argentino"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pyarrow>=17",
  "requests>=2.32",
  "openpyxl>=3.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "boto3>=1.43.89",
  "sqlalchemy>=2.0.52",
  "psycopg[binary]>=3.3.5",
  "typer>=0.27.2",
  "pyyaml>=6.0.3",
  "pyiceberg[glue]>=0.10",
]

[project.scripts]
ingest = "pipelines.ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.ruff]
line-length = 100
exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

# Los modulos que corren en un job de Glue Python shell traen Python 3.9; el resto del
# proyecto pide 3.11 (requires-python) y ruff lo toma de ahi. Lintar cada uno contra su
# version es mas preciso que ignorar reglas sueltas: ruff no sugiere `datetime.UTC` (UP017)
# ni `zip(strict=)` (B905) donde no existen, y sigue avisando si algun dia se usa otra cosa
# de 3.10 o 3.11 en estos archivos.
[tool.ruff.per-file-target-version]
"pipelines/ingest/**" = "py39"
"pipelines/reservas/**" = "py39"
"pipelines/aws/ingest_job.py" = "py39"
"pipelines/aws/bronze_reservas_job.py" = "py39"
"pipelines/aws/ssm.py" = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.16.6",
]
