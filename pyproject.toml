[project]
name = "argentina-oil-lakehouse-aws"
version = "0.1.0"
description = "Lakehouse serverless en AWS sobre datos publicos del upstream argentino"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pyarrow>=17",
  "requests>=2.32",
  "openpyxl>=3.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "boto3>=1.43.89",
  "sqlalchemy>=2.0.52",
  "psycopg[binary]>=3.3.5",
  "typer>=0.27.2",
  "pyyaml>=6.0.3",
  "pyiceberg[glue]>=0.10",
]

[project.scripts]
ingest = "pipelines.ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.ruff]
line-length = 100
exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Los jobs Python shell de Glue traen Python 3.9: `timezone.utc` en vez de `datetime.UTC`
# (UP017) y `zip` sin `strict` (B905). Los jobs de Spark corren en Glue 5.0 con Python 3.11
# y no necesitan la excepcion.
"pipelines/ingest/manifest.py" = ["UP017"]
"pipelines/reservas/bronze_load.py" = ["UP017", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.16.6",
]
