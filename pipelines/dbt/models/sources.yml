version: 2

# Las cuatro tablas de silver que gold toma como entrada. Las cuarentenas (`*_rejects`) y el
# historial de calidad (`dq_runs`) también viven en silver, pero ningún modelo las lee.

sources:
  - name: silver
    description: >
      Capa silver del lakehouse: tablas Iceberg tipadas y validadas por los contratos de
      `pipelines/contracts/` (ADR 0002). Gold no lee bronze ni landing.
    # El sufijo del ambiente (`silver_dev`, `silver_prod`) lo pone Terraform como argumento
    # del job de gold, igual que el de la base de gold (ADR 0005).
    schema: "silver{{ env_var('GLUE_DATABASE_SUFFIX', '') }}"

    tables:
      - name: produccion_pozo
        description: "Producción mensual declarada por pozo (DDJJ), 2006 en adelante. Grano pozo-mes."

      - name: pozo_primera_produccion
        description: "Padrón de pozos con el año y mes en que produjeron por primera vez."

      - name: fractura
        description: "Operaciones de fractura del Adjunto IV. Una fila por tratamiento declarado."

      - name: reservas
        description: "Reservas y recursos por yacimiento al 31/12, en formato largo (una fila por celda)."
