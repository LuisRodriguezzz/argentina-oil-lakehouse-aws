version: 2

models:
  - name: mart_pozo_completacion_produccion
    description: >
      Tabla ancha de análisis: un pozo fracturado por fila, con el diseño de su completación
      de un lado y lo que produjo en sus primeros meses del otro. Es la forma en que se plantea
      la pregunta del proyecto: cuánto de la productividad temprana se explica por cómo se
      estimuló el pozo.

      Solo entran pozos con al menos una fractura declarada. Los acumulados pueden venir
      nulos: un pozo fracturado hace tres meses todavía no tiene 12 meses de historia, y uno
      que todavía no declaró producción mayor a cero no tiene desde cuándo contar.

      **Qué fractura es "la" completación del pozo.** El Adjunto IV no trae una declaración
      por pozo: un mismo trabajo puede venir partido en varias filas (59 pozos, hasta seis el
      mismo día, algunas repetidas) y 129 pozos se volvieron a fracturar años después. Las
      declaraciones que empiezan con menos de 45 días de diferencia se consolidan en un
      trabajo (etapas y fluidos sumados, rama máxima, filas idénticas contadas una vez), y de
      los trabajos del pozo se elige el último anterior a la primera producción, que es el que
      explica los primeros meses. Si ninguno es anterior (pozos viejos que se re-fracturaron,
      o una fractura declarada con fecha posterior al arranque), queda el primero y
      `completacion_anterior_a_produccion` lo marca en falso: para esos pozos el diseño y la
      producción temprana no se corresponden, y conviene excluirlos al comparar.

      Está a nivel pozo y no a nivel pozo-mes a propósito: una fila por unidad de observación
      es lo que se necesita para comparar un pozo con otro.

    columns:
      - name: pozo_key
        description: "Clave del tramo vigente de dim_pozo. Nula si el pozo nunca declaró producción."

      - name: idpozo
        description: "Identificador del pozo. Es el grano de la tabla."
        data_tests: [unique, not_null]

      - name: sigla
        description: "Sigla del pozo, el identificador legible de la industria."

      - name: empresa
        description: "Operadora actual del pozo, normalizada."

      - name: empresa_key
        description: "Clave hacia dim_empresa."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_empresa')
                field: empresa_key

      - name: cuenca
        description: "Cuenca del yacimiento actual del pozo."

      - name: provincia
        description: "Provincia del yacimiento actual del pozo."

      - name: areayacimiento
        description: "Nombre del yacimiento actual del pozo."

      - name: formacion
        description: "Formación productiva actual (Vaca Muerta, etc.)."

      - name: tipo_de_recurso
        description: "Convencional o no convencional, según la última declaración del pozo."

      - name: sub_tipo_recurso
        description: "SHALE o TIGHT en el no convencional."

      - name: profundidad
        description: "Profundidad del pozo en metros."

      - name: primera_produccion
        description: >
          Primer día del primer mes con petróleo o gas mayor a cero (`dim_pozo.primera_produccion`).
          Es el origen de los acumulados. Nula si el pozo todavía no produjo.

      - name: anio_primera_produccion
        description: >
          Año de la primera producción: la cohorte del pozo. Los pozos se comparan contra los
          que arrancaron el mismo año, porque el diseño de completación cambia año a año. Nula
          si el pozo todavía no produjo.

      - name: fecha_inicio_fractura
        description: "Primer día del trabajo de completación elegido (la más temprana de sus declaraciones)."
        data_tests: [not_null]

      - name: tipo_terminacion
        description: "Método de terminación de la declaración con más etapas del trabajo."

      - name: longitud_rama_horizontal_m
        description: "Longitud de la rama horizontal, en metros. 0 en los pozos verticales."

      - name: cantidad_fracturas
        description: "Etapas de fractura del trabajo, sumando sus declaraciones. Es la medida de intensidad de la completación."

      - name: arena_bombeada_total_tn
        description: "Agente de sostén total del trabajo (nacional más importado), en toneladas."

      - name: agua_inyectada_m3
        description: "Agua bombeada en el trabajo, en m3."

      - name: co2_inyectado_m3
        description: "CO2 inyectado en el trabajo, en m3."

      - name: presion_maxima_psi
        description: "Presión máxima de tratamiento del trabajo, en psi."

      - name: potencia_equipos_fractura_hp
        description: "Potencia hidráulica máxima del set de bombeo en el trabajo, en HP."

      - name: duracion_dias
        description: "Días del primer inicio al último fin del trabajo. Nula cuando alguna declaración trae el fin antes del inicio."

      - name: declaraciones_de_fractura
        description: "Cuántas filas del Adjunto IV se consolidaron en el trabajo. 1 en el 98 % de los pozos."
        data_tests: [not_null]

      - name: completacion_anterior_a_produccion
        description: >
          Verdadero si el trabajo elegido empezó antes de que termine el mes de la primera
          producción (o si el pozo todavía no produjo). Falso en los pozos que ya producían
          cuando se fracturaron por primera vez: ahí el diseño no explica los acumulados.
        data_tests: [not_null]

      - name: prod_pet_3m
        description: "Petróleo acumulado en los primeros 3 meses desde la primera producción, en m3."

      - name: prod_pet_6m
        description: "Petróleo acumulado en los primeros 6 meses, en m3."

      - name: prod_pet_12m
        description: "Petróleo acumulado en los primeros 12 meses, en m3. Es la variable a explicar."

      - name: prod_gas_3m
        description: "Gas acumulado en los primeros 3 meses, en Mm3."

      - name: prod_gas_6m
        description: "Gas acumulado en los primeros 6 meses, en Mm3."

      - name: prod_gas_12m
        description: "Gas acumulado en los primeros 12 meses, en Mm3."

      - name: meses_con_declaracion
        description: >
          Cuántos de los primeros 12 meses tienen declaración. Sirve para descartar pozos con
          historia incompleta: 12 es una serie completa.

      - name: prod_pet_12m_por_metro
        description: >
          Petróleo de los primeros 12 meses por metro de rama horizontal, en m3/m. Deja
          comparables pozos de distinta longitud. Nula en los verticales (rama 0) y cuando
          falta alguno de los dos términos.

      - name: prod_pet_12m_por_etapa
        description: >
          Petróleo de los primeros 12 meses por etapa de fractura, en m3 por etapa. Nula
          cuando el pozo no declara etapas o no tiene 12 meses de producción.

      - name: arena_por_metro_tn
        description: >
          Toneladas de arena por metro de rama horizontal. Intensidad de la completación por
          longitud; complementa `arena_por_etapa_tn` de fact_fractura. Nula en los verticales
          y cuando falta la arena.

      - name: data_origin
        description: "Origen del dato: `derived`, porque gold se calcula; bronze y silver declaran `real`."
        data_tests:
          - accepted_values:
              arguments:
                values: ["derived"]
