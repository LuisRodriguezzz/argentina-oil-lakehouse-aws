version: 2

models:
  - name: fact_reservas
    description: >
      Reservas y recursos declarados al 31 de diciembre de cada año, con la empresa resuelta
      contra dim_empresa. Es la foto patrimonial: `fact_produccion_mensual` cuenta lo que se
      extrajo y esta tabla cuánto queda por extraer.

      El grano es operador · cuenca · provincia · yacimiento · hoja · tipo de recurso ·
      categoría · certeza · fluido · año. Silver tiene una fila por concesión y acá se agregan
      las concesiones (198.734 filas quedan en 190.366): para analizar reservas interesa el
      yacimiento, no bajo qué permiso está declarado. Cuenca y provincia sí se conservan en el
      grano porque 98 nombres de yacimiento se repiten en cuencas distintas y sumarlos mezclaría
      dos yacimientos que solo comparten el nombre.

      Unidades: Mm3 (miles de m3) para petróleo, MMm3 (millones de m3) para gas.

    columns:
      - name: empresa_key
        description: "Clave de la operadora que declara."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_empresa')
                field: empresa_key

      - name: operador
        description: "Razón social de la operadora tal como la escribe la planilla."
        data_tests: [not_null]

      - name: cuenca
        description: "Cuenca sedimentaria."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "NEUQUINA",
                    "GOLFO SAN JORGE",
                    "AUSTRAL",
                    "CUYANA",
                    "NOROESTE",
                    "NORESTE",
                    "ÑIRIHUAU",
                    "ARGENTINA NORTE",
                  ]

      - name: provincia
        description: "Provincia del yacimiento; 'Estado Nacional' en las áreas offshore."
        data_tests: [not_null]

      - name: yacimiento
        description: "Yacimiento; 'POZOS SIN YACIMIENTO' cuando la declaración no lo asigna."
        data_tests: [not_null]

      - name: hoja
        description: "Horizonte de la estimación: hasta el fin de la concesión o hasta el fin de la vida útil."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["fin_concesion", "fin_vida_util"]

      - name: tipo_recurso
        description: "Tipo de reservorio."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["convencional", "no_convencional"]

      - name: categoria
        description: "Reservas (comercialmente recuperables) o recursos contingentes (descubiertos, todavía no comerciales)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["reservas", "recursos_contingentes"]

      - name: certeza
        description: "Grado de certeza; 'no_aplica' en los recursos contingentes, que la planilla no subdivide."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["comprobadas", "probables", "posibles", "no_aplica"]

      - name: fluido
        description: "Fluido estimado."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["petroleo", "gas"]

      - name: unidad
        description: "Unidad del valor: Mm3 para petróleo, MMm3 para gas. Depende de `fluido`."
        data_tests:
          - accepted_values:
              arguments:
                values: ["Mm3", "MMm3"]

      - name: anio_corte
        description: "Año al 31/12 del que es la estimación. Publicados: 2020 a 2024."
        data_tests: [not_null]

      - name: concesiones
        description: "Cuántas concesiones se sumaron en la fila. 1 en la enorme mayoría."

      - name: valor
        description: >
          Volumen estimado en la unidad de la fila. Nulo cuando todas las celdas de origen
          venían vacías, que no es lo mismo que un cero declarado.
